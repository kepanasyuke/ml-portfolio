[project]
name = "magnit-ml-portfolio"
version = "0.1.0"
description = "Портфолио ML-инженера: uplift-моделирование и промо-экономика для Магнит доставки"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "PERF", "RUF"]
ignore = [
  "PLR2004", "PLR0913", "PLR0915", "PLR0917", "B008",
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"tools/style_gate.py" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "projects", "gateway"]
python_files = ["test_*.py"]
addopts = "-q"
